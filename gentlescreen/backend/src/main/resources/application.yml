spring:
  application:
    name: gentlescreen-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gentlescreen}
    username: ${DATABASE_USERNAME:gentlescreen}
    password: ${DATABASE_PASSWORD:gentlescreen-local}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: GentleScreen API
    description: Curated video catalog foundation

gentlescreen:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  ratings:
    reviewer-calmness-weight: 0.50
    visual-pacing-weight: 0.25
    audio-intensity-weight: 0.15
    parent-calmness-weight: 0.10

