name: gentlescreen

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gentlescreen}
      POSTGRES_USER: ${POSTGRES_USER:-gentlescreen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gentlescreen-local}
    ports:
      - "5432:5432"
    volumes:
      - gentlescreen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/gentlescreen}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-gentlescreen}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-gentlescreen-local}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-change-before-use}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  gentlescreen-postgres:

