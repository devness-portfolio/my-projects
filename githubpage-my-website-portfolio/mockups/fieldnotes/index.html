<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldnotes · Design review</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2ec;color:#13251e;font:14px/1.5 system-ui}header{padding:16px 24px;background:#f8f9f6;border-bottom:1px solid #ccd6ce}h1{font-size:20px;margin:0}p{margin:6px 0 14px;color:#52655e}nav{display:flex;flex-wrap:wrap;gap:8px}button,a{font:inherit;color:inherit;background:white;border:1px solid #ccd6ce;border-radius:7px;padding:9px 12px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#16845b;color:white}#viewport{margin:20px auto;width:calc(100% - 40px);height:calc(100vh - 210px);min-height:450px;transition:width .2s;border:1px solid #ccd6ce;border-radius:12px;overflow:hidden;background:#f8f9f6}iframe{border:0;width:100%;height:100%}button:focus-visible,a:focus-visible{outline:3px solid #16845b;outline-offset:2px}@media(prefers-reduced-motion:reduce){#viewport{transition:none}}@media(max-width:600px){header{padding:12px}#viewport{width:calc(100% - 16px);margin:8px auto;height:70vh}}</style><header><h1>Fieldnotes in devness.dev</h1><p id="description">A · Board first — familiar overview, visible stages, direct controls. Recommended for the portfolio.</p><nav aria-label="Mockup controls"><button data-option="a" aria-pressed="true">A · Board first</button><button data-option="b" aria-pressed="false">B · Focus first</button><button data-page="portfolio" aria-pressed="true">Website placement</button><button data-page="demo" aria-pressed="false">Demo page</button><button id="size" aria-pressed="false">Mobile · 390px</button><a id="open" href="portfolio-a.html#projects" target="_blank">Open full size ↗</a><a href="DESIGN.md" target="_blank">Design & test notes</a></nav></header><div id="viewport"><iframe title="Interactive portfolio mockup" src="portfolio-a.html#projects"></iframe></div><script>let option='a',page='portfolio';const frame=document.querySelector('iframe');function load(){const url=page+'-'+option+'.html'+(page==='portfolio'?'#projects':'');frame.src=url;document.querySelector('#open').href=url;document.querySelector('#description').textContent=option==='a'?'A · Board first — familiar overview, visible stages, direct controls. Recommended for the portfolio.':'B · Focus first — one next action, a calmer introduction, detailed stages below.';document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.option===option));document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===page))}document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{option=b.dataset.option;load()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;load()});document.querySelector('#size').onclick=e=>{const mobile=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',mobile);document.querySelector('#viewport').style.width=mobile?'min(390px, calc(100% - 16px))':''};</script></html>
