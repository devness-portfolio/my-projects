.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;career-timeline-mockups&quot;&gt;
  &lt;style&gt;
    #career-timeline-mockups {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;career-timeline-mockups&#x27;);
      const stage = root.querySelector(&#x27;#pf-stage&#x27;);
      const slider = root.querySelector(&#x27;#pf-progress&#x27;);
      const playButton = root.querySelector(&#x27;#pf-play&#x27;);
      const playLabel = playButton.querySelector(&#x27;span&#x27;);
      const conceptButtons = [...root.querySelectorAll(&#x27;.pf-concept&#x27;)];
      const views = [...root.querySelectorAll(&#x27;.pf-panel-view&#x27;)];
      const modeLabel = root.querySelector(&#x27;#pf-mode-label&#x27;);
      const yearLabel = root.querySelector(&#x27;#pf-stage-year&#x27;);
      const footerMode = root.querySelector(&#x27;#pf-footer-mode&#x27;);
      const footerMotion = root.querySelector(&#x27;.pf-footer span:last-child&#x27;);
      const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      let selectedConcept = &#x27;pulse&#x27;;
      let frame = null;

      const entries = [
        { year: &#x27;2023&#x27;, meta: &#x27;2023 · Foundation&#x27;, role: &#x27;Cloud Developer&#x27;, title: &#x27;Learning to ship the foundation.&#x27;, detail: &#x27;Built reliable services and deployment foundations that teams could safely grow on.&#x27;, desc: &#x27;Built reliable services and deployment foundations.&#x27; },
        { year: &#x27;2024&#x27;, meta: &#x27;2024 · Product&#x27;, role: &#x27;Platform Engineer&#x27;, title: &#x27;Turning infrastructure into a product.&#x27;, detail: &#x27;Made the paved road easier to use with reusable workflows, guardrails, and feedback loops.&#x27;, desc: &#x27;Turned infrastructure into a reusable developer experience.&#x27; },
        { year: &#x27;2025&#x27;, meta: &#x27;2025 · Intelligence&#x27;, role: &#x27;AI Systems Project&#x27;, title: &#x27;Making AI systems feel operable.&#x27;, detail: &#x27;Connected models, tools, evaluation, and telemetry into a workflow teams could understand and trust.&#x27;, desc: &#x27;Connected models, tools, and observability into one workflow.&#x27; },
        { year: &#x27;NOW&#x27;, meta: &#x27;Now · Exploration&#x27;, role: &#x27;What I’m building next&#x27;, title: &#x27;Designing what comes after the demo.&#x27;, detail: &#x27;Exploring human-centered infrastructure for AI-native products that need to earn trust over time.&#x27;, desc: &#x27;Human-centered infrastructure for AI-native products.&#x27; }
      ];

      const conceptCopy = {
        pulse: { mode: &#x27;01 · Scroll-linked reveal&#x27;, footer: &#x27;Pulse line&#x27;, motion: &#x27;Motion: line draw + directional card reveal&#x27; },
        chapter: { mode: &#x27;02 · Full-screen chapter snap&#x27;, footer: &#x27;Chapter snap&#x27;, motion: &#x27;Motion: year swap + headline lift&#x27; },
        map: { mode: &#x27;03 · Horizontal career route&#x27;, footer: &#x27;Career map&#x27;, motion: &#x27;Motion: route trace + moving detail card&#x27; }
      };

      function currentIndex(value) {
        return Math.min(3, Math.max(0, Math.floor((value + 8) / 30)));
      }

      function update(value) {
        const numeric = Number(value);
        const index = currentIndex(numeric);
        const entry = entries[index];
        stage.style.setProperty(&#x27;--pf-progress&#x27;, numeric);
        slider.value = numeric;
        yearLabel.textContent = entry.year;

        root.querySelectorAll(&#x27;.pf-pulse-item&#x27;).forEach((item, itemIndex) =&gt; {
          item.classList.toggle(&#x27;is-revealed&#x27;, numeric &gt;= itemIndex * 30 - 1);
          item.classList.toggle(&#x27;is-current&#x27;, itemIndex === index);
        });

        root.querySelectorAll(&#x27;.pf-chapter-stop, .pf-map-stop&#x27;).forEach(item =&gt; {
          const itemIndex = Number(item.dataset.stop);
          item.classList.toggle(&#x27;is-passed&#x27;, itemIndex &lt;= index);
          item.classList.toggle(&#x27;is-current&#x27;, itemIndex === index);
        });

        root.querySelector(&#x27;#pf-chapter-year&#x27;).textContent = entry.year;
        root.querySelector(&#x27;#pf-chapter-count&#x27;).textContent = `Chapter 0${index + 1} / 04`;
        root.querySelector(&#x27;#pf-chapter-title&#x27;).textContent = entry.title;
        root.querySelector(&#x27;#pf-chapter-detail&#x27;).textContent = `${entry.role} · ${entry.detail}`;
        root.querySelector(&#x27;#pf-map-meta&#x27;).textContent = entry.meta;
        root.querySelector(&#x27;#pf-map-title&#x27;).textContent = entry.role;
        root.querySelector(&#x27;#pf-map-desc&#x27;).textContent = entry.desc;

        const mapFocus = root.querySelector(&#x27;#pf-map-focus&#x27;);
        const available = Math.max(0, stage.clientWidth - mapFocus.offsetWidth - 52);
        mapFocus.style.transform = `translateX(${-available * (1 - numeric / 100)}px)`;
      }

      function selectConcept(concept) {
        selectedConcept = concept;
        conceptButtons.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.concept === concept)));
        views.forEach(view =&gt; view.classList.toggle(&#x27;is-active&#x27;, view.dataset.view === concept));
        const copy = conceptCopy[concept];
        modeLabel.textContent = copy.mode;
        footerMode.textContent = copy.footer;
        footerMotion.textContent = copy.motion;
        update(slider.value);
      }

      function stopPlayback() {
        if (frame) cancelAnimationFrame(frame);
        frame = null;
        playLabel.textContent = &#x27;Replay&#x27;;
      }

      function replay() {
        stopPlayback();
        if (reducedMotion.matches) {
          update(100);
          return;
        }
        const duration = 5200;
        const start = performance.now();
        playLabel.textContent = &#x27;Playing&#x27;;
        update(0);

        function tick(now) {
          const elapsed = Math.min(1, (now - start) / duration);
          const eased = elapsed &lt; .5 ? 2 * elapsed * elapsed : 1 - Math.pow(-2 * elapsed + 2, 2) / 2;
          update(Math.round(eased * 100));
          if (elapsed &lt; 1) frame = requestAnimationFrame(tick);
          else stopPlayback();
        }
        frame = requestAnimationFrame(tick);
      }

      conceptButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; selectConcept(button.dataset.concept)));
      slider.addEventListener(&#x27;input&#x27;, () =&gt; { stopPlayback(); update(slider.value); });
      playButton.addEventListener(&#x27;click&#x27;, replay);
      window.addEventListener(&#x27;resize&#x27;, () =&gt; update(slider.value));
      update(58);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;

    if (tooltip == null) {

    );

      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }

    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(

            elements.floating.style.setProperty(

      .then(({ x, y }) =&gt; {

        }

        floating.style.visibility = &quot;visible&quot;;
      })

        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
