<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1700" viewBox="0 0 1440 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110e"/>
      <stop offset="0.58" stop-color="#0a1713"/>
      <stop offset="1" stop-color="#07110e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122820"/>
      <stop offset="1" stop-color="#0b1814"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee6a8"/>
      <stop offset="1" stop-color="#27b77a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#5ee6a8" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".34"/></filter>
    <style>
      .sans{font-family:Inter,Manrope,Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,monospace}
      .muted{fill:#98aaa3}.white{fill:#eff9f4}.green{fill:#5ee6a8}.line{stroke:#29473b}
      .small{font-size:14px}.label{font-size:12px;letter-spacing:1.7px}.body{font-size:18px}.nav{font-size:14px;font-weight:700}
      .h1{font-size:64px;font-weight:800;letter-spacing:-2px}.h2{font-size:38px;font-weight:800;letter-spacing:-1px}.h3{font-size:22px;font-weight:750}
    </style>
  </defs>
  <rect width="1440" height="1700" fill="url(#bg)"/>
  <rect width="1440" height="1700" fill="url(#grid)"/>
  <circle cx="1240" cy="250" r="310" fill="#29c484" opacity=".055"/>
  <circle cx="120" cy="820" r="270" fill="#29c484" opacity=".035"/>

  <!-- Focused navigation -->
  <g transform="translate(92 30)" filter="url(#shadow)">
    <rect width="1256" height="76" rx="38" fill="#0d1e18" fill-opacity=".94" stroke="#29473b"/>
    <g transform="translate(24 18)">
      <rect width="40" height="40" rx="12" fill="url(#accent)"/>
      <path d="M15 12 8 20l7 8M25 12l7 8-7 8" fill="none" stroke="#06110d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="27" class="sans white" font-size="19" font-weight="800">devness</text>
    </g>
    <g class="sans nav muted" transform="translate(520 0)">
      <text x="0" y="47">Work</text><text x="78" y="47">Experience</text><text x="190" y="47">About</text>
    </g>
    <g transform="translate(965 14)">
      <rect width="112" height="48" rx="10" fill="none" stroke="#416354"/>
      <text x="25" y="30" class="sans white nav">Resume ↓</text>
      <rect x="124" width="143" height="48" rx="10" fill="url(#accent)"/>
      <text x="151" y="30" class="sans nav" fill="#06110d">Contact me ↗</text>
    </g>
  </g>

  <!-- Recruiter-first hero -->
  <g transform="translate(108 185)">
    <g>
      <rect width="255" height="34" rx="17" fill="#10251d" stroke="#315747"/>
      <circle cx="18" cy="17" r="5" fill="#5ee6a8"/>
      <text x="32" y="22" class="mono green label">OPEN TO SWE ROLES</text>
      <text y="94" class="sans white h1">I build reliable software</text>
      <text y="166" class="sans white h1">for systems that <tspan class="green">matter.</tspan></text>
      <text y="218" class="sans muted body">Java / Spring engineer with over 5 years of experience in modernization,</text>
      <text y="246" class="sans muted body">cloud delivery, accessibility, and production support.</text>
      <g transform="translate(0 286)">
        <rect width="171" height="54" rx="10" fill="url(#accent)"/>
        <text x="28" y="34" class="sans nav" fill="#06110d">Explore my work ↘</text>
        <rect x="184" width="162" height="54" rx="10" fill="none" stroke="#416354"/>
        <text x="211" y="34" class="sans white nav">Download resume</text>
      </g>
      <g transform="translate(0 385)">
        <text class="mono muted small">JAVA</text><text x="75" class="mono muted small">SPRING</text>
        <text x="168" class="mono muted small">AWS / GCP</text><text x="284" class="mono muted small">DEVOPS</text>
        <text x="380" class="mono muted small">SECTION 508</text>
      </g>
    </g>

    <!-- Interactive profile console concept -->
    <g transform="translate(730 -10)" filter="url(#shadow)">
      <rect width="494" height="448" rx="20" fill="url(#panel)" stroke="#315747"/>
      <g transform="translate(22 18)">
        <circle cx="6" cy="6" r="6" fill="#ef786b"/><circle cx="28" cy="6" r="6" fill="#d9ae55"/><circle cx="50" cy="6" r="6" fill="#5ee6a8"/>
        <text x="290" y="10" class="mono muted" font-size="12">anes@portfolio / profile</text>
      </g>
      <line x1="0" x2="494" y1="50" y2="50" class="line"/>
      <g transform="translate(22 72)">
        <rect width="138" height="34" rx="8" fill="#19382b"/><text x="18" y="22" class="mono green small">01 / OVERVIEW</text>
        <text x="158" y="22" class="mono muted small">02 / IMPACT</text><text x="292" y="22" class="mono muted small">03 / STACK</text>
        <text y="76" class="mono green small">$ cat recruiter-summary.json</text>
        <text y="118" class="mono white small">{</text>
        <text x="18" y="148" class="mono muted small">"role": <tspan class="green">"Software Engineer"</tspan>,</text>
        <text x="18" y="178" class="mono muted small">"experience": <tspan class="green">"over 5 years of experience"</tspan>,</text>
        <text x="18" y="208" class="mono muted small">"strengths": [</text>
        <text x="36" y="238" class="mono green small">"Java + Spring", "modernization",</text>
        <text x="36" y="268" class="mono green small">"accessible delivery", "cloud ops"</text>
        <text x="18" y="298" class="mono muted small">],</text>
        <text x="18" y="328" class="mono muted small">"credentials": <tspan class="green">"U.S. Citizen · Public Trust"</tspan></text>
        <text y="358" class="mono white small">}</text>
      </g>
    </g>
  </g>

  <!-- Proof strip -->
  <g transform="translate(108 700)">
    <rect width="1224" height="112" rx="18" fill="#0d1e18" stroke="#29473b"/>
    <g class="sans">
      <text x="34" y="44" class="green" font-size="23" font-weight="800">Over 5 years</text><text x="34" y="72" class="muted small">of experience</text>
      <line x1="280" x2="280" y1="24" y2="88" class="line"/>
      <text x="318" y="44" class="white" font-size="21" font-weight="750">Public-sector systems</text><text x="318" y="72" class="muted small">security · reporting · accessibility</text>
      <line x1="646" x2="646" y1="24" y2="88" class="line"/>
      <text x="684" y="44" class="white" font-size="21" font-weight="750">Full-stack range</text><text x="684" y="72" class="muted small">frontend through cloud delivery</text>
      <line x1="967" x2="967" y1="24" y2="88" class="line"/>
      <text x="1004" y="44" class="green" font-size="21" font-weight="750">Available</text><text x="1004" y="72" class="muted small">full-time SWE roles</text>
    </g>
  </g>

  <!-- Selected work -->
  <g transform="translate(108 900)">
    <text class="mono green label">/ SELECTED WORK</text>
    <text y="55" class="sans white h2">Evidence, decisions, outcomes.</text>
    <text y="87" class="sans muted" font-size="16">Each case study answers what recruiters actually need to know.</text>
    <g transform="translate(0 130)">
      <rect width="744" height="360" rx="20" fill="url(#panel)" stroke="#3b6956"/>
      <rect x="26" y="24" width="116" height="28" rx="14" fill="#19382b"/><text x="42" y="43" class="mono green" font-size="11">CASE STUDY 01</text>
      <text x="26" y="97" class="sans white" font-size="30" font-weight="800">Dr. Sadaf Ijaz MD</text>
      <text x="26" y="130" class="sans muted" font-size="16">A credible, accessible patient journey—built for easy handoff.</text>
      <g transform="translate(26 170)">
        <text class="mono muted" font-size="11">CHALLENGE</text><text y="27" class="sans white" font-size="15">Clarify care options and build trust</text>
        <text x="230" class="mono muted" font-size="11">DECISION</text><text x="230" y="27" class="sans white" font-size="15">Static, dependency-light delivery</text>
        <text x="486" class="mono muted" font-size="11">PROOF</text><text x="486" y="27" class="sans white" font-size="15">Live production website</text>
      </g>
      <g transform="translate(26 264)">
        <rect width="156" height="48" rx="9" fill="url(#accent)"/><text x="24" y="30" class="sans nav" fill="#06110d">Read case study →</text>
        <rect x="168" width="118" height="48" rx="9" fill="none" stroke="#416354"/><text x="193" y="30" class="sans white nav">Live site ↗</text>
      </g>
      <g transform="translate(770 0)">
        <rect width="454" height="172" rx="20" fill="#0d1e18" stroke="#29473b"/>
        <text x="22" y="32" class="mono green" font-size="11">CONFIDENTIAL WORK / 02</text>
        <text x="22" y="70" class="sans white h3">Federal modernization</text>
        <text x="22" y="101" class="sans muted" font-size="14">Spring migration · MFA · nationwide reporting</text>
        <text x="22" y="142" class="mono green" font-size="12">VIEW SANITIZED TECHNICAL BREAKDOWN →</text>
        <rect y="188" width="454" height="172" rx="20" fill="#0d1e18" stroke="#29473b"/>
        <text x="22" y="220" class="mono green" font-size="11">ENGINEERING LAB / 03</text>
        <text x="22" y="258" class="sans white h3">Interactive system demo</text>
        <text x="22" y="289" class="sans muted" font-size="14">Architecture, API flow, tests, and live code</text>
        <text x="22" y="330" class="mono green" font-size="12">LAUNCH DEMO →</text>
      </g>
    </g>
  </g>

  <!-- Experience preview -->
  <g transform="translate(108 1490)">
    <line x1="0" x2="1224" class="line"/>
    <text y="58" class="mono green label">/ EXPERIENCE</text>
    <text x="205" y="60" class="sans white" font-size="19" font-weight="750">2022–2025</text>
    <text x="335" y="60" class="sans white" font-size="19" font-weight="750">Software Engineer II</text>
    <text x="585" y="60" class="sans muted" font-size="16">Department of Labor · Alesig Consulting</text>
    <rect x="1082" y="31" width="142" height="40" rx="20" fill="none" stroke="#416354"/><text x="1109" y="56" class="sans white nav">View impact +</text>
  </g>
</svg>
